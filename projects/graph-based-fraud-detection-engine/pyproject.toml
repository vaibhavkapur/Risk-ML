[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-based-fraud-detection-engine"
version = "0.1.0"
description = "Temporal entity-graph fraud detection engine with privacy-safe IDs, leak-free graph features, calibrated logistic/boosted/GNN models, graph-traced explanations, and analyst review workflows."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy==1.26.4",
    "scipy==1.13.1",
    "scikit-learn==1.5.2",
    "networkx==3.2.1",
    "fastapi==0.115.6",
    "uvicorn==0.32.1",
    "pydantic==2.10.4",
    "PyYAML==6.0.2",
    "joblib==1.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]
pyg = [
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

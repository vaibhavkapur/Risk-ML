[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-transaction-risk-platform"
version = "0.1.0"
description = "Low-latency, versioned real-time transaction risk scoring prototype with offline/online feature parity, calibration, timeout fallback, and replayable audit logging."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy==1.26.4",
    "scipy==1.13.1",
    "scikit-learn==1.5.2",
    "fastapi==0.115.6",
    "uvicorn==0.32.1",
    "pydantic==2.10.4",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]
redis = [
    "redis>=5.0.0,<6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-scoring-platform"
version = "0.1.0"
description = "Educational credit risk scoring prototype estimating calibrated probability of default with point-in-time contracts, temporal validation, stability and subgroup diagnostics, explanations, and a manual review interface."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy==1.26.4",
    "scipy==1.13.1",
    "scikit-learn==1.5.2",
    "PyYAML==6.0.2",
    "joblib==1.4.2",
    "matplotlib==3.9.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]
xgboost = [
    "xgboost==2.1.3",
]
shap = [
    "shap==0.46.0",
]

[project.scripts]
credit-risk-demo = "credit_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -v"

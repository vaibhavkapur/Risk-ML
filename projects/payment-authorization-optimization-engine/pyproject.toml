[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-authorization-optimization-engine"
version = "0.1.0"
description = "Risk-aware payment authorization optimization, calibrated acceptance/loss modeling, and counterfactual policy evaluation prototype."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24.0,<2.1.0",
    "scikit-learn>=1.3.0,<1.7.0",
    "scipy>=1.10.0,<1.14.0",
    "fastapi>=0.110.0,<0.120.0",
    "pydantic>=2.6.0,<3.0.0",
    "PyYAML>=6.0,<7.0",
    "uvicorn>=0.27.0,<0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<9.0.0",
    "httpx>=0.26.0,<0.29.0",
]

[project.scripts]
payment-auth-engine = "payment_auth_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore:.*encountered in matmul:RuntimeWarning:sklearn",
]

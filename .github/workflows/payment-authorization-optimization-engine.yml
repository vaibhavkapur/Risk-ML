name: Payment Authorization Optimization Engine CI

on:
  push:
    paths:
      - "projects/payment-authorization-optimization-engine/**"
      - ".github/workflows/payment-authorization-optimization-engine.yml"
  pull_request:
    paths:
      - "projects/payment-authorization-optimization-engine/**"
      - ".github/workflows/payment-authorization-optimization-engine.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/payment-authorization-optimization-engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full test suite, demo, and replay check
        run: |
          python scripts/validate_all.py

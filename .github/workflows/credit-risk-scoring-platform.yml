name: Credit Risk Scoring Platform CI

on:
  push:
    paths:
      - "projects/credit-risk-scoring-platform/**"
      - ".github/workflows/credit-risk-scoring-platform.yml"
  pull_request:
    paths:
      - "projects/credit-risk-scoring-platform/**"
      - ".github/workflows/credit-risk-scoring-platform.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/credit-risk-scoring-platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full test suite
        run: pytest

      - name: Run deterministic end-to-end demo
        run: python scripts/run_demo.py --config config/default.yaml

      - name: Verify generated evidence artifacts exist
        run: |
          test -f reports/evaluation_report.json
          test -f reports/baseline_comparison.json
          test -f reports/runtime_metadata.json
          test -f reports/model_card.md
          test -f reports/calibration_plot.png
          test -f reports/calibration_plot.svg
          test -f reports/manual_review_queue.json

name: Real-Time Transaction Risk Platform CI

on:
  push:
    paths:
      - "projects/real-time-transaction-risk-platform/**"
      - ".github/workflows/real-time-transaction-risk-platform.yml"
  pull_request:
    paths:
      - "projects/real-time-transaction-risk-platform/**"
      - ".github/workflows/real-time-transaction-risk-platform.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/real-time-transaction-risk-platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated test suite
        run: pytest -v

      - name: Run reproducible demo and acceptance benchmark
        run: python scripts/run_demo.py --benchmark-requests 1000
